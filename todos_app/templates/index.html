{% extends 'base.html' %}
{% block content %}    

    <h2 style="margin-top:0">오늘</h2>
    <p style="color:#999; margin-bottom:24px">나를 성장시키는 메모</p>

    <form action="/add" method="post">
        <textarea name="task" rows="5" placeholder="Enter your task" id="task"></textarea>
        <button type="submit" id="add_task">
          Add
        </button>
    </form>

    <br>
    <h2>Tasks</h2>

    <div>
        {% for todo in todos %}
        <div class="task">
            <form action="/toggle/{{ todo.id }}" method="post" style="display:inline; margin:0">
                <input type="checkbox" class="task-check" onchange="this.form.submit()"
                       {% if todo.completed %}checked{% endif %}>
            </form>
            <span style="flex:1">
                {% if todo.completed %}
                    <strike>{{ todo.task }}</strike>
                {% else %}
                    {{ todo.task }}
                {% endif %}
            </span>
            <div class="task-actions">
                <a href="/edit/{{ todo.id }}" class="todo-btn">Edit</a>
                <a href="/delete/{{ todo.id }}" class="todo-btn">Delete</a>
            </div>
        </div>
        {% endfor %}
    </div>
{% endblock content %}
